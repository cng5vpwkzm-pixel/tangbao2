<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>喉结儿菜谱</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Microsoft YaHei','PingFang SC',sans-serif; background:#f5f0e8; color:#333; min-height:100vh; }

/* ===== Header ===== */
.header { background:linear-gradient(135deg,#e74c3c,#c0392b); color:#fff; padding:14px 20px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.2); position:sticky; top:0; z-index:50; }
.header h1 { font-size:22px; letter-spacing:2px; cursor:pointer; transition:all .2s; }
.header h1:hover { opacity:.8; text-shadow:0 0 12px rgba(255,255,255,.5); }
.header h1::after { content:' ✎'; font-size:12px; opacity:0; transition:opacity .2s; }
.header h1:hover::after { opacity:.6; }
.header .subtitle { font-size:12px; opacity:.85; margin-top:2px; }
.cloud-sync-btn { position:absolute; top:10px; right:16px; background:rgba(255,255,255,.2); color:#fff; border:1px solid rgba(255,255,255,.4); padding:5px 12px; border-radius:16px; cursor:pointer; font-size:12px; transition:all .2s; display:flex; align-items:center; gap:4px; }
.cloud-sync-btn:hover { background:rgba(255,255,255,.35); }
.cloud-sync-btn.online { background:rgba(39,174,96,.6); border-color:rgba(39,174,96,.8); }
.cloud-sync-btn.offline { background:rgba(231,76,60,.5); border-color:rgba(231,76,60,.7); }
.cloud-sync-btn .sync-dot { width:7px; height:7px; border-radius:50%; background:#2ecc71; display:inline-block; }
.cloud-sync-btn.offline .sync-dot { background:#f39c12; }

/* ===== Screen Container ===== */
.screen { display:none; max-width:1200px; margin:0 auto; padding:16px; padding-bottom:80px; }
.screen.active { display:block; }

/* ===== Bottom Tab Bar ===== */
.bottom-tab-bar { position:fixed; bottom:0; left:0; right:0; background:#fff; display:flex; box-shadow:0 -2px 12px rgba(0,0,0,.1); z-index:60; padding:5px 0; padding-bottom:max(5px, env(safe-area-inset-bottom)); }
.tab-item { flex:1; text-align:center; padding:6px 4px; cursor:pointer; transition:all .2s; color:#999; font-size:12px; }
.tab-item .tab-icon { font-size:20px; display:block; margin-bottom:1px; }
.tab-item .tab-label { font-size:11px; }
.tab-item.active { color:#e74c3c; }
.tab-item.active .tab-icon { transform:scale(1.1); }

/* ===== Screen 1: Week View ===== */
.week-nav { display:flex; justify-content:center; align-items:center; gap:10px; margin:16px 0; flex-wrap:wrap; }
.week-nav button { background:#e74c3c; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; transition:all .2s; }
.week-nav button:hover { background:#c0392b; }
.week-nav .week-label { font-size:16px; font-weight:bold; min-width:200px; text-align:center; color:#2c3e50; cursor:pointer; transition:all .2s; padding:6px 12px; border-radius:8px; }
.week-nav .week-label:hover { background:#fde8e8; color:#c0392b; }
.week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:16px; }
.day-card { background:#fff; border-radius:10px; padding:10px; min-height:220px; box-shadow:0 1px 4px rgba(0,0,0,.08); border-top:3px solid #ddd; cursor:pointer; transition:all .2s; position:relative; }
.day-card:hover { box-shadow:0 3px 12px rgba(0,0,0,.12); }
.day-card.today { border-top-color:#e74c3c; box-shadow:0 2px 8px rgba(231,76,60,.2); }
.day-card.active { border-top-color:#e67e22; box-shadow:0 2px 12px rgba(230,126,34,.25); background:#fffaf5; }
.day-card .day-name { font-weight:bold; font-size:14px; margin-bottom:2px; }
	.day-card .day-date { font-size:11px; color:#888; margin-bottom:8px; }
.day-card.today .day-name { color:#e74c3c; }
.day-card.active .day-name { color:#e67e22; }
.day-recipe { background:#fff3cd; border-radius:6px; padding:6px 8px; margin-bottom:4px; font-size:12px; cursor:pointer; position:relative; border-left:3px solid #ffc107; transition:all .15s; }
.day-recipe:hover { background:#ffe69c; }
.day-recipe .recipe-name { font-weight:bold; }
.day-recipe .recipe-time { color:#666; font-size:11px; }
.day-recipe .remove-btn { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:#e74c3c; color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer; line-height:20px; text-align:center; opacity:0; transition:opacity .15s; }
.day-recipe:hover .remove-btn { opacity:1; }
.day-empty { color:#bbb; font-size:12px; text-align:center; padding:30px 0; }
.day-empty .empty-icon { font-size:24px; display:block; margin-bottom:4px; }
.btn-row { display:flex; justify-content:center; gap:12px; margin:16px 0; flex-wrap:wrap; }
.btn { padding:12px 32px; border:none; border-radius:8px; font-size:16px; cursor:pointer; font-weight:bold; transition:all .2s; }
.btn-pick { background:#e74c3c; color:#fff; font-size:18px; padding:14px 48px; box-shadow:0 4px 12px rgba(231,76,60,.3); }
.btn-pick:hover { background:#c0392b; transform:translateY(-2px); box-shadow:0 6px 16px rgba(231,76,60,.4); }
.btn-clear { background:#95a5a6; color:#fff; }
.btn-clear:hover { background:#7f8c8d; }
.btn-back { background:transparent; color:#e74c3c; border:1px solid #e74c3c; padding:8px 20px; border-radius:6px; cursor:pointer; font-size:14px; transition:all .2s; }
.btn-back:hover { background:#fdf2f2; }
.active-day-info { text-align:center; margin:8px 0; font-size:14px; color:#e67e22; }
.active-day-info strong { background:#fff3e0; padding:2px 8px; border-radius:4px; }

/* ===== Screen 2: Category ===== */
.category-grid { display:flex; justify-content:center; gap:24px; margin:20px 0; flex-wrap:wrap; }
.cat-card { background:#fff; border-radius:16px; padding:32px 24px; text-align:center; cursor:pointer; width:260px; box-shadow:0 2px 12px rgba(0,0,0,.08); transition:all .3s; position:relative; }
.cat-card:hover { transform:translateY(-6px); box-shadow:0 8px 28px rgba(0,0,0,.15); }
.cat-card .cat-icon { font-size:48px; margin-bottom:12px; }
.cat-card .cat-title { font-size:20px; font-weight:bold; margin-bottom:6px; }
.cat-card .cat-count { font-size:14px; color:#888; }
.cat-card .cat-hint { font-size:12px; color:#aaa; margin-top:6px; }
.cat-card.seasonal { border:2px solid #ffc107; }
.cat-card.seasonal:hover { background:#fffde7; }
.cat-card.home { border:2px solid #3498db; }
.cat-card.home:hover { background:#eaf2fd; }
.cat-card .cat-add-btn { display:block; margin-top:12px; padding:6px 16px; background:#e74c3c; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; transition:all .2s; width:100%; }
.cat-card .cat-add-btn:hover { background:#c0392b; }

/* ===== Screen 3: Recipe List ===== */
.recipe-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; background:#fff; padding:12px 16px; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.search-box { flex:1; min-width:200px; padding:10px 16px; border:2px solid #ddd; border-radius:8px; font-size:14px; outline:none; transition:border .2s; }
.search-box:focus { border-color:#e74c3c; }
.recipe-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; }
.recipe-card { background:#fff; border-radius:10px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); transition:all .2s; border-left:4px solid #e74c3c; display:flex; flex-direction:column; }
.recipe-card.home-card { border-left-color:#3498db; }
.recipe-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.12); transform:translateY(-1px); }
.recipe-card .r-name { font-size:17px; font-weight:bold; margin-bottom:6px; color:#2c3e50; }
.recipe-card .r-meta { display:flex; gap:12px; font-size:12px; color:#888; margin-bottom:8px; flex-wrap:wrap; }
.recipe-card .r-meta span { background:#f5f5f5; padding:2px 8px; border-radius:4px; }
.recipe-card .r-prep { font-size:13px; color:#e74c3c; font-weight:bold; margin-bottom:8px; }
.recipe-card .r-ingredients { font-size:12px; color:#555; margin-bottom:10px; max-height:72px; overflow:hidden; line-height:1.6; background:#fafafa; padding:8px; border-radius:6px; }
.recipe-card .r-actions { display:flex; gap:6px; margin-top:auto; }
.recipe-card .r-actions button { flex:1; padding:8px 0; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-weight:bold; transition:all .2s; }
.btn-select { background:#e74c3c; color:#fff; }
.btn-select:hover { background:#c0392b; }
.btn-detail { background:#f0f0f0; color:#555; }
.btn-detail:hover { background:#e0e0e0; }
.btn-edit-card { background:#3498db; color:#fff; }
	.btn-edit-card:hover { background:#2980b9; }

	/* Recipe star button */
	.recipe-card .r-star-btn { position:absolute; top:8px; right:8px; background:transparent; border:none; font-size:20px; cursor:pointer; padding:0; line-height:1; transition:transform .2s; z-index:2; }
	.recipe-card .r-star-btn:hover { transform:scale(1.3); }
	.recipe-card.starred { border-left-color:#f39c12; background:#fffef5; }
	.recipe-card.starred .r-star-btn { color:#f39c12; }
	.r-star-filter { background:#fff; color:#f39c12; border:2px solid #f39c12; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:bold; white-space:nowrap; transition:all .2s; }
	.r-star-filter:hover { background:#fff8e1; }
	.r-star-filter.active { background:#f39c12; color:#fff; }

	/* Custom category card */
	.cat-card.custom { border:2px solid #27ae60; }
	.cat-card.custom:hover { background:#e8f5e9; }
	.cat-card .cat-delete-btn { position:absolute; top:8px; right:8px; background:transparent; border:none; font-size:16px; cursor:pointer; color:#aaa; padding:2px 6px; border-radius:50%; transition:all .2s; }
	.cat-card .cat-delete-btn:hover { color:#e74c3c; background:#fde8e8; }

	/* Category management modal */
	.cat-mgmt-modal { max-width:450px; }
	.cat-mgmt-list { list-style:none; margin:0; padding:0; }
	.cat-mgmt-item { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid #eee; gap:8px; }
	.cat-mgmt-item .cat-mgmt-name { flex:1; font-size:14px; font-weight:bold; }
	.cat-mgmt-item .cat-mgmt-count { font-size:12px; color:#888; margin-right:8px; }
	.cat-mgmt-item .cat-mgmt-actions { display:flex; gap:4px; }
	.cat-mgmt-item button { padding:4px 10px; border:none; border-radius:4px; cursor:pointer; font-size:12px; transition:all .2s; }
	.cat-mgmt-item .btn-rename { background:#3498db; color:#fff; }
	.cat-mgmt-item .btn-rename:hover { background:#2980b9; }
	.cat-mgmt-item .btn-delete-cat { background:#e74c3c; color:#fff; }
	.cat-mgmt-item .btn-delete-cat:hover { background:#c0392b; }
	.cat-mgmt-item.fixed-cat .cat-mgmt-actions { display:none; }
	.cat-mgmt-add { display:flex; gap:8px; margin-top:12px; }
	.cat-mgmt-add input { flex:1; padding:8px 12px; border:2px solid #ddd; border-radius:6px; font-size:14px; font-family:inherit; outline:none; }
	.cat-mgmt-add input:focus { border-color:#27ae60; }
	.cat-mgmt-add button { background:#27ae60; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; font-weight:bold; }
	.cat-mgmt-add button:hover { background:#219a52; }

/* ===== Screen 4: History ===== */
.history-nav { display:flex; justify-content:center; align-items:center; gap:10px; margin:16px 0; flex-wrap:wrap; }
.history-nav button { background:#e74c3c; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; transition:all .2s; }
.history-nav button:hover { background:#c0392b; }
.history-nav input[type="date"] { padding:8px 12px; border:2px solid #ddd; border-radius:6px; font-size:14px; font-family:inherit; outline:none; }
.history-nav input[type="date"]:focus { border-color:#e74c3c; }
.history-date-info { text-align:center; font-size:14px; color:#e67e22; margin-bottom:12px; }
.history-recipe-list { max-width:650px; margin:0 auto; }
.history-recipe-item { background:#fff; border-radius:10px; padding:14px 16px; margin-bottom:8px; box-shadow:0 1px 4px rgba(0,0,0,.08); border-left:4px solid #e74c3c; cursor:pointer; display:flex; justify-content:space-between; align-items:center; transition:all .2s; }
.history-recipe-item:hover { box-shadow:0 3px 12px rgba(0,0,0,.12); }
.history-recipe-item .h-name { font-weight:bold; font-size:15px; flex:1; }
.history-recipe-item .h-time { color:#888; font-size:12px; margin-left:12px; white-space:nowrap; }
.history-recipe-item .h-arrow { color:#ccc; margin-left:8px; }
.history-empty { text-align:center; color:#bbb; padding:40px 0; font-size:14px; }
.history-empty .empty-icon { font-size:40px; display:block; margin-bottom:8px; }

/* ===== Modal ===== */
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:100; justify-content:center; align-items:center; padding:20px; }
.modal-overlay.active { display:flex; }
.modal { background:#fff; border-radius:16px; padding:24px; max-width:650px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,.2); }
.modal h2 { margin-bottom:16px; color:#2c3e50; font-size:20px; padding-bottom:8px; border-bottom:2px solid #f0f0f0; }
.modal .detail-section { margin-bottom:14px; }
.modal .detail-section h3 { font-size:14px; color:#e74c3c; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.modal .detail-section pre { white-space:pre-wrap; font-family:'Microsoft YaHei',sans-serif; font-size:13px; line-height:1.7; background:#f8f8f8; padding:12px; border-radius:8px; margin:0; }
.modal .detail-section img { max-width:100%; max-height:250px; border-radius:8px; display:block; margin-bottom:8px; object-fit:cover; }
.modal .close-btn { background:#e74c3c; color:#fff; border:none; padding:10px 28px; border-radius:6px; cursor:pointer; font-size:14px; float:right; margin-top:4px; transition:all .2s; }
.modal .close-btn:hover { background:#c0392b; }

/* ===== Form Modal ===== */
.form-modal { max-width:550px; }
.form-modal .form-group { margin-bottom:14px; }
.form-modal .form-group label { display:block; font-size:13px; font-weight:bold; color:#555; margin-bottom:4px; }
.form-modal .form-group input,
.form-modal .form-group select,
.form-modal .form-group textarea { width:100%; padding:10px 12px; border:2px solid #ddd; border-radius:8px; font-size:14px; font-family:inherit; transition:border .2s; outline:none; }
.form-modal .form-group input:focus,
.form-modal .form-group select:focus,
.form-modal .form-group textarea:focus { border-color:#e74c3c; }
.form-modal .form-actions { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; flex-wrap:wrap; }
.form-modal .btn-save { background:#e74c3c; color:#fff; border:none; padding:10px 28px; border-radius:6px; cursor:pointer; font-size:14px; font-weight:bold; }
.form-modal .btn-save:hover { background:#c0392b; }
.form-modal .btn-cancel { background:#f0f0f0; color:#555; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:14px; }
.form-modal .btn-delete { background:#c0392b; color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:14px; margin-right:auto; }
.form-modal .btn-delete:hover { background:#a93226; }
.image-upload-area { border:2px dashed #ddd; border-radius:8px; padding:16px; text-align:center; cursor:pointer; transition:border .2s; position:relative; }
.image-upload-area:hover { border-color:#e74c3c; }
.image-upload-area input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; }
.image-preview img { max-width:100%; max-height:200px; border-radius:8px; object-fit:cover; }
.upload-placeholder { color:#aaa; font-size:14px; }
.btn-remove-image { margin-top:8px; background:#e74c3c; color:#fff; border:none; padding:6px 16px; border-radius:4px; cursor:pointer; font-size:12px; }

/* ===== Calendar Modal ===== */
.calendar-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:100; justify-content:center; align-items:center; padding:20px; }
.calendar-overlay.active { display:flex; }
.calendar-popup { background:#fff; border-radius:16px; padding:24px; max-width:480px; width:100%; box-shadow:0 8px 32px rgba(0,0,0,.2); }
.calendar-popup h2 { text-align:center; margin-bottom:16px; color:#2c3e50; font-size:18px; }
.calendar-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.calendar-nav button { background:transparent; border:none; font-size:20px; cursor:pointer; padding:4px 12px; color:#e74c3c; }
.calendar-nav button:hover { color:#c0392b; }
.calendar-nav .cal-month-label { font-size:16px; font-weight:bold; color:#2c3e50; }
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
.calendar-grid .cal-day-header { font-size:12px; color:#888; padding:6px 0; font-weight:bold; }
.calendar-grid .cal-day { padding:10px 0; border-radius:8px; cursor:pointer; font-size:14px; transition:all .2s; position:relative; }
.calendar-grid .cal-day:hover { background:#fde8e8; }
.calendar-grid .cal-day.today { background:#e74c3c; color:#fff; font-weight:bold; }
.calendar-grid .cal-day.in-week { background:#ffeaa7; }
.calendar-grid .cal-day.in-week.today { background:#e74c3c; color:#fff; }
.calendar-grid .cal-day.other-month { color:#ccc; cursor:default; }
.calendar-grid .cal-day.other-month:hover { background:transparent; }
	.calendar-row { display:contents; }
	.calendar-actions { text-align:center; margin-top:16px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
	.calendar-actions button { background:#e74c3c; color:#fff; border:none; padding:8px 24px; border-radius:6px; cursor:pointer; font-size:14px; margin:0; transition:all .2s; }
	.calendar-actions button:hover { background:#c0392b; }
	.calendar-actions button.btn-cancel { background:#95a5a6; }
	.calendar-actions button.btn-cancel:hover { background:#7f8c8d; }

	/* ===== Toast ===== */
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#27ae60; color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; z-index:200; display:none; animation:toastIn .3s; box-shadow:0 4px 12px rgba(0,0,0,.2); }
.toast.show { display:block; }
.toast.warning { background:#e67e22; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(10px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }

/* ===== Token Modal ===== */
.token-modal { max-width:400px; text-align:center; }
.token-modal h3 { margin-bottom:12px; color:#2c3e50; font-size:18px; }
.token-modal p { margin-bottom:16px; color:#666; font-size:14px; line-height:1.6; }
.token-modal input[type="password"] { width:100%; padding:12px 16px; border:2px solid #ddd; border-radius:8px; font-size:14px; font-family:monospace; transition:border .2s; outline:none; margin-bottom:16px; }
.token-modal input[type="password"]:focus { border-color:#e74c3c; }
.token-modal .modal-buttons { display:flex; gap:10px; justify-content:center; }
.token-modal .btn { padding:10px 24px; border-radius:6px; font-size:14px; font-weight:bold; cursor:pointer; border:none; transition:all .2s; }
.token-modal .btn-primary { background:#e74c3c; color:#fff; }
.token-modal .btn-primary:hover { background:#c0392b; }
.token-modal .btn-secondary { background:#f0f0f0; color:#555; }
.token-modal .btn-secondary:hover { background:#e0e0e0; }
.token-modal .token-hint { font-size:12px; color:#999; margin-top:12px; }

/* ===== Version Badge ===== */
.version-badge { position:absolute; bottom:4px; right:12px; font-size:11px; color:rgba(255,255,255,.6); font-weight:bold; }

/* ===== Responsive ===== */
@media (max-width:900px) { .week-grid { grid-template-columns:repeat(3,1fr); } }
@media (max-width:600px) {
  .week-grid { grid-template-columns:repeat(2,1fr); } .recipe-list { grid-template-columns:1fr; } .cat-card { width:100%; }
  .bottom-tab-bar { padding:4px 0; } .tab-item .tab-icon { font-size:18px; } .tab-item .tab-label { font-size:10px; }
  .form-modal { margin:10px; } .recipe-card .r-actions button { font-size:11px; }
}
</style>

</head>
<body>

<div class="header">
  <h1>🍳 喉结儿菜谱</h1>
  <div class="subtitle" id="headerTitle">今日食谱</div>
  <button class="cloud-sync-btn offline" id="cloudSyncBtn" onclick="toggleCloudSync()" title="点击启用云端同步">
    <span class="sync-dot"></span> <span id="cloudSyncLabel">未启用云同步</span>
  </button>
  <div class="version-badge">v2.2</div>
</div>

<!-- ===== Screen 1: Weekly Menu ===== -->
<div class="screen active" id="screen1">
  <div class="week-nav">
    <button onclick="prevWeek()">◀ 上周</button>

<script>
// ==================== GitHub Gist 配置 ====================
// 👇 请在此处粘贴你的 GitHub 配置（详见下方说明）
var GIST_CONFIG = {
  token: "",                   // 从 localStorage 读取，首次使用时通过界面输入
  gistId: ""                   // 留空，首次同步会自动创建。创建后请在此处填写，如: "abc123def456"
};
// ==================== 数据命名空间 ====================
// 修改此值可创建独立的数据空间，不同文件互不干扰
var DATA_NAMESPACE = 'tangbao';

function lsGet(key) { return localStorage.getItem(DATA_NAMESPACE + '_' + key); }
function lsSet(key, value) { localStorage.setItem(DATA_NAMESPACE + '_' + key, value); }
function lsRemove(key) { localStorage.removeItem(DATA_NAMESPACE + '_' + key); }
var GIST_FILENAME = DATA_NAMESPACE + '_recipes_data.json';

function migrateFromOldNamespace() {
  var oldKeys = ['recipes_v1', 'starred_recipes_v1', 'categories_v1', 'menu_v2', 'app_title', 'github_token', 'gist_id', 'cloud_sync_enabled'];
  var migrated = false;
  for (var i = 0; i < oldKeys.length; i++) {
    var oldKey = 'houjie_' + oldKeys[i];
    var value = localStorage.getItem(oldKey);
    if (value) {
      var newKey = DATA_NAMESPACE + '_' + oldKeys[i];
      if (!localStorage.getItem(newKey)) {
        localStorage.setItem(newKey, value);
        migrated = true;
        console.log('Migrated:', oldKey, '->', newKey);
      }
    }
  }
  if (migrated) {
    showToast('📥 已从旧版本迁移数据', false);
  }
}

migrateFromOldNamespace();


// ==================== CLOUD SYNC（基于 GitHub Gist） ====================
var cloudSyncEnabled = false;
var cloudInitialized = false;
var cloudPollTimer = null;
var cloudLastUpdated = '';
var cloudLocalUpdating = false;

function initCloud() {
  // 从 localStorage 读取 token
  var savedToken = lsGet('github_token');
  if (savedToken) {
    GIST_CONFIG.token = savedToken;
  }
  // 从 localStorage 恢复 gistId
  var savedId = lsGet('gist_id');
  if (savedId) GIST_CONFIG.gistId = savedId;
  cloudInitialized = true;
  updateSyncButtonUI();
  return !!GIST_CONFIG.token;
}

var syncBtnLastClick = 0;

function toggleCloudSync() {
  var now = Date.now();
  if (cloudSyncEnabled && now - syncBtnLastClick < 300) {
    showSyncStatus();
    syncBtnLastClick = 0;
    return;
  }
  syncBtnLastClick = now;
  
  if (!cloudSyncEnabled) {
    if (!GIST_CONFIG.token) {
      openTokenModal();
    } else {
      var btn = document.getElementById('cloudSyncBtn');
      if (btn && btn.classList.contains('offline')) {
        if (confirm('检测到已有 Token，但云同步已断开。\n\n是否重新输入 Token？\n\n- 取消：尝试使用现有 Token 重新连接\n- 确定：重新输入新的 Token')) {
          openTokenModal();
        } else {
          enableCloudSync();
        }
      } else {
        enableCloudSync();
      }
    }
  } else {
    disableCloudSync();
  }
}

function enableCloudSync() {
  console.log('☁️ enableCloudSync() 开始');
  console.log('   ☁️ 当前状态: token=' + (GIST_CONFIG.token ? '已设置(' + GIST_CONFIG.token.length + ')' : '未设置') + ', gistId=' + (GIST_CONFIG.gistId || '未设置'));
  
  cloudSyncEnabled = true;
  lsSet('cloud_sync_enabled', '1');
  updateSyncButtonUI();
  showToast('☁️ 正在连接 GitHub...');
  
  if (GIST_CONFIG.gistId) {
    console.log('☁️ Gist ID 已存在: ' + GIST_CONFIG.gistId + '，直接加载数据');
    loadFromCloud(function(success) {
      if (success) {
        console.log('✅ 云端数据加载成功，开始轮询');
        showToast('☁️ 云同步已启用，数据每3秒自动同步');
        startCloudPolling();
      } else {
        console.error('❌ 云端连接失败');
        showToast('⚠️ 云端连接失败，请检查 Token 和网络', true);
        cloudSyncEnabled = false;
        lsRemove('cloud_sync_enabled');
        updateSyncButtonUI();
      }
    });
  } else {
    console.log('☁️ Gist ID 不存在，开始查找已有 Gist');
    showToast('🔍 正在查找已有的云端数据...');
    findExistingGist(function(foundId) {
      if (foundId) {
        console.log('✅ 找到已有 Gist: ' + foundId);
        showToast('✅ 找到云端数据，正在加载...');
        GIST_CONFIG.gistId = foundId;
        lsSet('gist_id', foundId);
        console.log('   ✅ Gist ID 已保存到 localStorage');
        loadFromCloud(function(success) {
          if (success) {
            console.log('✅ 云端数据加载成功，开始轮询');
            showToast('☁️ 云同步已启用，数据每3秒自动同步');
            startCloudPolling();
          } else {
            console.error('❌ 加载云端数据失败');
            showToast('⚠️ 加载云端数据失败，请检查网络', true);
            cloudSyncEnabled = false;
            lsRemove('cloud_sync_enabled');
            updateSyncButtonUI();
          }
        });
      } else {
        console.log('❌ 未找到已有 Gist，需要创建新的');
        showToast('📦 未找到云端数据，正在创建...');
        createCloudGist(function(success) {
          if (success) {
            console.log('✅ Gist 创建成功: ' + GIST_CONFIG.gistId);
            showToast('🎉 Gist 创建成功！ID: ' + GIST_CONFIG.gistId + '\n其他设备使用相同 Token 即可同步');
            startCloudPolling();
          } else {
            console.error('❌ 创建 Gist 失败');
            showToast('⚠️ 创建云端存储失败，请检查 Token 和网络', true);
            cloudSyncEnabled = false;
            lsRemove('cloud_sync_enabled');
            updateSyncButtonUI();
          }
        });
      }
    });
  }
}

function disableCloudSync() {
  cloudSyncEnabled = false;
  lsRemove('cloud_sync_enabled');
  updateSyncButtonUI();
  stopCloudPolling();
  showToast('📦 已切换为本地存储模式');
}

function updateSyncButtonUI() {
  var btn = document.getElementById('cloudSyncBtn');
  var label = document.getElementById('cloudSyncLabel');
  if (!btn || !label) return;
  if (cloudSyncEnabled) {
    btn.className = 'cloud-sync-btn online';
    label.textContent = '云同步已启用';
    btn.title = '点击关闭云端同步';
  } else if (GIST_CONFIG.token) {
    btn.className = 'cloud-sync-btn offline';
    label.textContent = '云同步已断开';
    btn.title = '点击启用云端同步';
  } else {
    btn.className = 'cloud-sync-btn offline';
    label.textContent = '云同步未启用';
    btn.title = '点击启用多人协作云同步';
  }
}

function showSyncStatus() {
  var modal = document.getElementById('modalOverlay');
  var content = document.getElementById('modalContent');
  
  var recipes = RECIPES.getAll();
  var cats = getCategories();
  
  content.innerHTML = `
    <h2>🔍 云同步状态</h2>
    <div style="font-family: monospace; font-size: 13px; line-height: 1.8;">
      <p><strong>Token:</strong> ${GIST_CONFIG.token ? '✓ 已配置（长度: ' + GIST_CONFIG.token.length + '）' : '✗ 未配置'}</p>
      <p><strong>Gist ID:</strong> ${GIST_CONFIG.gistId || '✗ 未配置'}</p>
      <p><strong>同步状态:</strong> ${cloudSyncEnabled ? '✓ 已启用' : '✗ 已禁用'}</p>
      <p><strong>已初始化:</strong> ${cloudInitialized ? '✓ 是' : '✗ 否'}</p>
      <p><strong>正在更新:</strong> ${cloudLocalUpdating ? '✓ 是' : '✗ 否'}</p>
      <p><strong>上次更新:</strong> ${cloudLastUpdated || '从未'}</p>
      <p><strong>命名空间:</strong> ${DATA_NAMESPACE}</p>
      <p><strong>Gist 文件名:</strong> ${GIST_FILENAME}</p>
      <hr style="margin: 16px 0; border: none; border-top: 1px solid #eee;">
      <p><strong>本地菜谱数:</strong> ${recipes.length}</p>
      <p><strong>本地分类:</strong> ${cats.join(', ')}</p>
      <hr style="margin: 16px 0; border: none; border-top: 1px solid #eee;">
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn" style="background:#3498db;color:#fff;padding:8px 16px;font-size:13px;" onclick="checkSyncConnection()">🔍 测试连接</button>
        <button class="btn" style="background:#27ae60;color:#fff;padding:8px 16px;font-size:13px;" onclick="pushToCloud();closeModal()">⬆️ 手动同步</button>
        <button class="btn" style="background:#e74c3c;color:#fff;padding:8px 16px;font-size:13px;" onclick="findExistingGist(function(id) { alert(id ? '找到 Gist: ' + id : '未找到匹配的 Gist'); });">🔍 查找 Gist</button>
      </div>
    </div>
    <button class="close-btn" onclick="closeModal()">关闭</button>
  `;
  
  modal.classList.add('active');
}

function checkSyncConnection() {
  if (!GIST_CONFIG.token) {
    showToast('⚠️ 请先输入 Token', true);
    return;
  }
  showToast('🔍 正在检测连接...');
  githubApi('GET', '/user').then(function(user) {
    showToast('✅ Token 有效，用户: ' + user.login);
  }).catch(function(err) {
    showToast('❌ Token 无效或网络错误', true);
  });
}

function openTokenModal() {
  document.getElementById('tokenModalOverlay').classList.add('active');
  document.getElementById('tokenInput').value = '';
  setTimeout(function() {
    document.getElementById('tokenInput').focus();
  }, 100);
}

function closeTokenModal() {
  document.getElementById('tokenModalOverlay').classList.remove('active');
}

function confirmToken() {
  var token = document.getElementById('tokenInput').value.trim();
  if (!token) {
    showToast('⚠️ 请输入 Token', true);
    return;
  }
  closeTokenModal();
  GIST_CONFIG.token = token;
  lsSet('github_token', GIST_CONFIG.token);
  lsSet('cloud_sync_enabled', '1');
  enableCloudSync();
}

function testTokenConnection() {
  var token = document.getElementById('tokenInput').value.trim();
  if (!token) {
    showToast('⚠️ 请先输入 Token', true);
    return;
  }
  var resultDiv = document.getElementById('tokenTestResult');
  resultDiv.style.display = 'block';
  resultDiv.style.background = '#f8f8f8';
  resultDiv.style.color = '#333';
  resultDiv.textContent = '🔍 正在测试连接...';
  
  fetch('https://api.github.com/user', {
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github.v3+json'
    }
  }).then(function(res) {
    if (res.ok) {
      return res.json();
    }
    throw new Error('HTTP ' + res.status);
  }).then(function(user) {
    resultDiv.style.background = '#d4edda';
    resultDiv.style.color = '#155724';
    resultDiv.innerHTML = '✅ Token 有效！<br>用户: ' + user.login + '<br>现在点击「确认」启用云同步';
  }).catch(function(err) {
    resultDiv.style.background = '#f8d7da';
    resultDiv.style.color = '#721c24';
    resultDiv.innerHTML = '❌ 连接失败: ' + err.message + '<br>请检查 Token 是否正确';
  });
}

// GitHub API 请求封装
function githubApi(method, path, body) {
  var opts = {
    method: method,
    headers: {
      'Authorization': 'token ' + GIST_CONFIG.token,
      'Accept': 'application/vnd.github.v3+json'
    }
  };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  return fetch('https://api.github.com' + path, opts).then(function(r) {
    if (!r.ok) throw new Error('GitHub API error: ' + r.status);
    return r.json();
  });
}

// 创建 Gist（首次使用）
function createCloudGist(callback) {
  var data = {
    description: '喉结儿菜谱 - 云端数据',
    public: false,
    files: {
      GIST_FILENAME: {
        content: JSON.stringify({
          recipes: RECIPES.categories,
          starred: getStarredRecipeIds(),
          categories: getCategories(),
          title: getCurrentAppTitle(),
          menu: getMenu(),
          version: Date.now()
        })
      }
    }
  };
  githubApi('POST', '/gists', data).then(function(gist) {
    GIST_CONFIG.gistId = gist.id;
    lsSet('gist_id', gist.id);
    cloudLastUpdated = gist.updated_at;
    showToast('🎉 Gist 创建成功！ID: ' + gist.id + '\n请重新上传文件到 GitHub');
    if (callback) callback(true);
  }).catch(function(err) {
    console.error('创建 Gist 失败:', err);
    if (callback) callback(false);
  });
}

function findExistingGist(callback) {
  console.log('🔍 查找已有的 Gist...');
  console.log('   🔍 目标文件名: ' + GIST_FILENAME);
  
  githubApi('GET', '/gists').then(function(gists) {
    console.log('🔍 API 返回 ' + gists.length + ' 个 Gist');
    
    if (gists.length === 0) {
      console.log('❌ 用户没有任何 Gist');
      if (callback) callback(null);
      return;
    }
    
    for (var i = 0; i < gists.length; i++) {
      var gist = gists[i];
      console.log('   🔍 检查 Gist[' + i + ']: ' + gist.id + ' (' + (gist.description || '无描述') + ')');
      
      if (gist.files) {
        var fileNames = Object.keys(gist.files);
        console.log('      📁 文件列表: [' + fileNames.join(', ') + ']');
        
        if (gist.files[GIST_FILENAME]) {
          console.log('✅ 找到匹配的 Gist: ' + gist.id);
          if (callback) callback(gist.id);
          return;
        }
      }
    }
    
    console.log('❌ 遍历所有 Gist，未找到匹配文件名 "' + GIST_FILENAME + '" 的 Gist');
    if (callback) callback(null);
  }).catch(function(err) {
    console.error('❌ 查找 Gist 失败:', err);
    console.error('   ❌ 错误详情:', err.message);
    showToast('❌ 无法访问 GitHub: ' + err.message, true);
    if (callback) callback(null);
  });
}

// 从云端加载数据
function loadFromCloud(callback) {
  githubApi('GET', '/gists/' + GIST_CONFIG.gistId).then(function(gist) {
    if (gist.updated_at === cloudLastUpdated) {
      if (callback) callback(true);
      return;
    }
    cloudLastUpdated = gist.updated_at;
    var file = gist.files && gist.files[GIST_FILENAME];
    if (!file || !file.content) {
      if (callback) callback(true);
      return;
    }
    applyCloudData(file.content);
    if (callback) callback(true);
  }).catch(function(err) {
    console.error('从云端读取失败:', err);
    if (callback) callback(false);
  });
}

// 应用云端数据到本地
function applyCloudData(contentStr) {
  cloudLocalUpdating = true;
  try {
    var data = JSON.parse(contentStr);
    if (data.recipes) {
      RECIPES.categories = data.recipes;
      saveRecipesToStorageLocal();
    }
    if (data.starred) {
      lsSet('starred_recipes_v1', JSON.stringify(data.starred));
    }
    if (data.categories) {
      lsSet('categories_v1', JSON.stringify(data.categories));
    }
    if (data.title) {
      lsSet('app_title', data.title);
      var h1 = document.querySelector('.header h1');
      if (h1) { h1.textContent = '🍳 ' + data.title; document.title = data.title; }
    }
    if (data.menu) {
      saveMenu(data.menu);
    }
    syncCategoryDisplay();
    if (currentCategory) {
      currentRecipes = getRecipesByCategory(currentCategory);
      renderRecipeList(currentRecipes);
    }
    renderWeek();
  } catch(e) {
    console.error('应用云端数据失败:', e);
  }
  cloudLocalUpdating = false;
}

// 推送数据到云端
function pushToCloud() {
  if (!cloudSyncEnabled) {
    console.log('❌ pushToCloud: 云同步未启用');
    return;
  }
  if (!cloudInitialized) {
    console.log('❌ pushToCloud: 云同步未初始化');
    return;
  }
  if (cloudLocalUpdating) {
    console.log('❌ pushToCloud: 正在从云端更新本地数据');
    return;
  }
  if (!GIST_CONFIG.gistId) {
    console.log('❌ pushToCloud: 没有 Gist ID');
    showToast('⚠️ 未连接到云端，请先启用云同步', true);
    return;
  }
  if (!GIST_CONFIG.token) {
    console.log('❌ pushToCloud: 没有 Token');
    showToast('⚠️ Token 未设置，请重新输入', true);
    return;
  }
  
  console.log('☁️ pushToCloud: 开始推送数据...');
  var data = {
    recipes: RECIPES.categories,
    starred: getStarredRecipeIds(),
    categories: getCategories(),
    title: getCurrentAppTitle(),
    menu: getMenu(),
    version: Date.now()
  };
  
  githubApi('PATCH', '/gists/' + GIST_CONFIG.gistId, {
    files: {
      GIST_FILENAME: { content: JSON.stringify(data) }
    }
  }).then(function(gist) {
    cloudLastUpdated = gist.updated_at;
    console.log('✅ 数据已推送到云端');
  }).catch(function(err) {
    console.error('❌ 推送数据到云端失败:', err);
    var errMsg = '❌ 同步失败';
    if (err.message && err.message.includes('404')) {
      errMsg = '❌ Gist 不存在，可能已被删除';
    } else if (err.message && err.message.includes('403')) {
      errMsg = '❌ Token 权限不足，请检查 Token';
    } else if (err.message && err.message.includes('401')) {
      errMsg = '❌ Token 无效，请重新输入';
    } else {
      errMsg = '❌ 同步失败: ' + err.message;
    }
    showToast(errMsg, true);
  });
}

// 仅保存到本地（不触发云端同步，避免循环）
function saveRecipesToStorageLocal() {
  try {
    var data = {categories: RECIPES.categories};
    lsSet('recipes_v1', JSON.stringify(data));
  } catch(e) {
    showToast('⚠️ 存储空间不足，请清理旧数据', true);
  }
}

// 云端轮询（每3秒检查一次）
function startCloudPolling() {
  stopCloudPolling();
  cloudPollTimer = setInterval(function() {
    if (!cloudSyncEnabled || !GIST_CONFIG.gistId || cloudLocalUpdating) return;
    githubApi('GET', '/gists/' + GIST_CONFIG.gistId).then(function(gist) {
      if (gist.updated_at === cloudLastUpdated) return;
      cloudLastUpdated = gist.updated_at;
      var file = gist.files && gist.files[GIST_FILENAME];
      if (file && file.content) {
        applyCloudData(file.content);
      }
    }).catch(function(err) {
      // 静默忽略轮询错误
    });
  }, 3000);
}

function stopCloudPolling() {
  if (cloudPollTimer) {
    clearInterval(cloudPollTimer);
    cloudPollTimer = null;
  }
}

    return r;
  });

}

ime":"腌制30分钟","steps":"1.鸡切块加料酒1勺、生抽1勺、蚝油1勺、白糖1小勺、淀粉1勺腌30分钟；2.沙姜去皮切碎末，葱切段；3.平底锅中火热油（火候：中火）；4.鸡块皮朝下中火煎至金黄（火候：中火），约4分钟；5.翻面继续煎3分钟至两面金黄；6.撒沙姜末翻炒出香；7.转小火盖盖焗5分钟至鸡肉熟透（火候：小火）；8.开盖大火翻炒收汁，撒葱段出锅（火候：大火）","ingredients":"鸡半只、沙姜1块、葱2根、生抽1.5勺、蚝油1勺、白糖1小勺、淀粉1勺、料酒1勺、食用油2勺、平底锅/砂锅"},{"category":"home","month":"全年","stepTime":"腌鱼10分钟、煎蛋2分钟、煎鱼5分钟、煮汤15分钟","name":"煎蛋鲫鱼豆腐汤","type":"家常菜","prepTime":"腌制10分钟","steps":"1.鲫鱼处理干净两面划刀，加料酒半勺、盐少许腌10分钟，擦干水分；2.豆腐切块；3.大火热油煎两个荷包蛋盛出（火候：大火）；4.补油大火下鲫鱼煎至两面金黄（火候：大火），每面约2分钟；5.下姜片爆香；6.加开水（一定要开水）没过鱼身大火煮沸（火候：大火）；7.大火煮5分钟至汤色变白；8.下豆腐和荷包蛋转小火煮10分钟（火候：小火）；9.加盐1.5小勺调味，撒葱花出锅","ingredients":"鲫鱼1条、豆腐1块、鸡蛋2个、姜4片、葱1根、盐1.5小勺、料酒1勺、食用油2勺、炒锅/汤锅"},{"category":"home","month":"全年","stepTime":"酿豆泡10分钟、炒番茄3分钟、炖煮8分钟","name":"番茄金针菇豆泡酿虾滑","type":"家常菜","prepTime":"无","steps":"1.豆泡切开小口，将虾滑塞入豆泡中填满；2.番茄切块，金针菇去根洗净；3.中火热油下姜末爆香（火候：中火）；4.下番茄块大火炒软出汁（火候：大火）；5.加半碗水大火煮沸；6.下金针菇和酿好的豆泡；7.小火炖8分钟（火候：小火）；8.加生抽1勺、盐1小勺调味；9.撒葱花出锅","ingredients":"番茄2个、金针菇1把、豆泡10个、虾滑200g、葱姜适量、生抽1勺、盐1小勺、食用油2勺、砂锅"},{"category":"home","month":"全年","stepTime":"处理10分钟、煎蟹2分钟、翻炒2分钟、焖3分钟","name":"姜葱炒三目蟹","type":"家常菜","prepTime":"无","steps":"1.螃蟹处理干净去腮去胃，切块；2.蟹钳拍裂，切口沾淀粉；3.姜切片，葱切段；4.大火热油（油稍多）下姜片大火爆香（火候：大火）；5.蟹块切口朝下中火煎至定型（火候：中火），约2分钟；6.大火翻炒至蟹壳变红（火候：大火）；7.加料酒1勺、盐半小勺和少量水；8.盖盖中火焖3分钟（火候：中火）；9.开盖大火翻炒，下葱段翻炒30秒出锅（火候：大火）","ingredients":"三目蟹2只、姜5片、葱3根、料酒1勺、盐半小勺、淀粉1勺、食用油2勺、炒锅"},{"category":"home","month":"全年","stepTime":"腌肉10分钟、滑炒2分钟、炒口蘑2分钟、汇合1分钟","name":"口蘑炒猪肉","type":"家常菜","prepTime":"腌制10分钟","steps":"1.肉片加料酒半勺、生抽半勺、淀粉1勺、盐少许腌10分钟；2.口蘑切片，蒜切片；3.中火热油下肉片滑炒至变色盛出（火候：中火）；4.大火下蒜片爆香（火候：大火）；5.下口蘑大火翻炒至出汁变软（火候：大火），约2分钟；6.倒回肉片，加生抽半勺、盐半小勺大火翻炒1分钟出锅","ingredients":"口蘑150g、猪肉片150g、大蒜3瓣、生抽1勺、料酒1勺、盐1小勺、淀粉1勺、食用油2勺、炒锅"},{"category":"home","month":"全年","stepTime":"腌肉15分钟、煎制6分钟","name":"干煎五花肉","type":"家常菜","prepTime":"腌制15分钟","steps":"1.五花肉切薄片（约0.3cm）；2.加盐半小勺、黑胡椒少许、孜然粉1小勺抓匀腌15分钟；3.平底锅不放油，中火加热（火候：中火）；4.五花肉片平铺中火煎至出油底面金黄（火候：中火），约3分钟；5.翻面继续煎3分钟至两面焦脆；6.用厨房纸吸去多余油脂；7.出锅装盘","ingredients":"五花肉300g、盐半小勺、黑胡椒少许、孜然粉1小勺、食用油少许、平底锅"},{"category":"home","month":"全年","stepTime":"洗花螺 大火）\n4.蒜切末\n5.调酱汁：生抽1勺、醋1勺、香油1勺、盐半小勺、白糖半小勺、蒜末搅匀\n6.菠菜和粉丝混合，倒入酱汁拌匀\n7.撒白芝麻即可","ingredients":"菠菜200g\n粉丝1把\n蒜3瓣\n生抽1勺\n醋1勺\n香油1勺\n盐半小勺\n白糖半小勺\n白芝麻少许\n炒锅"},{"category":"seasonal","month":"1月","stepTime":"浸泡20分钟\n焯水5分钟\n炖煮52分钟","name":"山药炖排骨","type":"当季菜(冬季)","prepTime":"浸泡20分钟","steps":"1.排骨冷水浸泡20分钟去血水\n2.冷水下锅大火焯水加姜2片料酒半勺，撇浮沫捞出（火候：大火）\n3.山药去皮切滚刀块（戴手套），胡萝卜切滚刀块\n4.砂锅大火烧开水（火候：大火）\n5.下排骨姜片大火煮沸转小火炖35分钟（火候：小火）\n6.下山药和胡萝卜继续小火炖15分钟至山药软糯\n7.加盐1.5小勺、枸杞，再炖2分钟\n8.撒葱花出锅","ingredients":"排骨300g\n山药200g\n胡萝卜1根\n姜4片\n葱1根\n料酒1勺\n盐1.5小勺\n枸杞少许\n砂锅"},{"category":"seasonal","month":"2月","stepTime":"腌萝卜10分钟\n炒料5分钟\n蒸40分钟\n煎制5分钟","name":"萝卜糕","type":"当季菜(冬季)","prepTime":"泡发香菇虾米30分钟","steps":"1.萝卜去皮刨丝，加盐半小勺腌10分钟挤干水分\n2.腊肠切丁、香菇泡发切丁、虾米泡软\n3.中火热油炒香腊肠虾米香菇（火候：中火）\n4.粘米粉加水250ml调成米浆\n5.将萝卜丝炒料倒入米浆，加盐半小勺、白胡椒粉半小勺拌匀\n6.倒入抹油容器，蒸锅大火蒸40分钟（火候：大火）\n7.取出晾凉切片\n8.平底锅中火煎至两面金黄即可","ingredients":"白萝卜500g\n粘米粉200g\n腊肠1根\n虾米20g\n香菇3朵\n盐1小勺\n白胡椒粉半小勺\n食用油适量\n蒸锅/平底锅"},{"category":"seasonal","month":"2月","stepTime":"煮腊肉10分钟\n煸炒5分钟\n爆炒2分钟","name":"蒜苗炒腊肉","type":"当季菜(冬季)","prepTime":"无","steps":"1.腊肉冷水下锅大火煮10分钟去咸，切薄片（火候：大火）\n2.蒜苗切斜段，蒜白蒜绿分开\n3.中火热油下腊肉片煸炒出油至微卷（火候：中火）\n4.下姜片干辣椒和蒜白段大火爆香（火候：大火）\n5.下蒜绿段大火翻炒1分钟\n6.加料酒1勺、生抽半勺、盐少许调味出锅","ingredients":"蒜苗200g\n腊肉150g\n姜3片\n干辣椒3个\n料酒1勺\n生抽半勺\n盐少许\n食用油1勺\n炒锅"},{"category":"seasonal","month":"2月","stepTime":"腌肉15分钟\n炒馅5分钟\n包制15分钟\n炸制5分钟","name":"春卷","type":"当季菜(冬季)","prepTime":"腌制15分钟","steps":"1.韭菜切碎、香菇泡发切丁、豆芽洗净\n2.肉馅加盐半小勺、生抽1勺、料酒1勺、白胡椒粉半小勺、淀粉1勺搅匀腌制15分钟\n3.中火热油炒熟肉馅盛出（火候：中火）\n4.混合韭菜香菇豆芽和肉馅拌匀\n5.春卷皮包入馅料卷紧\n6.锅中倒油中火烧至六成热（筷子冒泡）\n7.下春卷中火炸至金黄捞出（火候：中火），约3-4分钟\n8.大火复炸30秒更加酥脆","ingredients":"春卷皮20张\n猪肉馅200g\n韭菜100g\n豆芽100g\n香菇3朵\n盐1小勺\n生抽1勺\n料酒1勺\n白胡椒粉半小勺\n淀粉1勺\n食用油适量\n炒锅/炸锅"},{"category":"seasonal","month":"2月","stepTime":"醒面30分钟\n备馅10分钟\n包制15分钟\n煎制6分钟","name":"韭菜盒子","type":"当季菜(冬季)","prepTime":"醒面30分钟","steps":"1.面粉加温水揉成光滑面团，醒面30分钟\n2.韭菜洗净切碎，加少许油拌匀锁水\n3.鸡蛋打散加盐少许，大火热油炒熟搅碎盛出（火候：大火）\n4.粉丝温水泡软15分钟切碎\n5.混合韭菜、鸡蛋、粉丝，加盐1小勺、生抽1勺、香油1勺拌匀\n6.面团分剂擀成圆形面皮\n7.包入馅料对折捏紧花边\n8.平底锅中火刷油（火候：中火）\n9.放入韭菜盒子中火煎至一面金黄翻面（火候：中火），每面约3分钟\n10.两面金黄出锅","ingredients":"韭菜200g\n鸡蛋3个\n粉丝50g\n面粉300g\n温水150ml\n盐1小勺\n生抽1勺\n香油1勺\n食用油3勺\n平底锅"},{"category":"seasonal","month":"2月","stepTime":"浸泡15分钟\n腌制10分钟\n焯菠菜1分钟\n煮制2分钟","name":"菠菜猪肝汤","type":"当季菜(冬季)","prepTime":"浸泡15分钟","steps":"1.猪肝切薄片，清水浸泡15分钟去血水，换水2-3次\n2.猪肝沥干加料酒1勺、盐少许、淀粉1勺抓匀腌10分钟\n3.菠菜洗净，沸水大火焯30秒去草酸捞出过凉水（火候：大火），切段\n4.汤锅大火烧开水（火候：大火）\n5.加姜片，下猪肝片大火煮至变色立即捞出（火候：大火，约30秒，不要煮老）\n6.锅中水继续大火煮沸，下菠菜煮1分钟\n7.倒回猪肝，加盐1小勺调味\n8.撒枸杞，滴几滴香油出锅","ingredients":"菠菜150g\n猪肝150g\n姜4片\n枸杞少许\n料酒1勺\n盐1小勺\n淀粉1勺\n香油几滴\n汤锅"},{"category":"seasonal","month":"2月","stepTime":"腌肉15分钟\n焯芹菜1分钟\n滑炒2分钟\n翻炒2分钟","name":"芹菜炒牛肉","type":"当季菜(冬季)","prepTime":"腌制15分钟","steps":"1.牛肉逆纹切丝加料酒1勺、生抽1勺、淀粉1勺、盐少许腌15分钟\n2.芹菜去叶切段，小米辣切圈，蒜姜切末\n3.沸水大火焯芹菜段30秒捞出过凉水（火候：大火）\n4.中火热油下牛肉丝大火滑炒至变色盛出（火候：大火）\n5.留底油下姜蒜小米辣大火爆香（火候：大火）\n6.下芹菜段大火翻炒1分钟\n7.倒回牛肉丝，加生抽半勺、盐半小勺大火翻炒30秒出锅","ingredients":"牛肉200g\n芹菜200g\n小米辣2个\n蒜2瓣\n姜2片\n生抽1.5勺\n料酒1勺\n淀粉1勺\n盐1小勺\n食用油2勺\n炒锅"},{"category":"seasonal","month":"2月","stepTime":"腌肉10分钟\n滑炒2分钟\n炒胡萝卜2分钟\n汇合1分钟","name":"胡萝卜炒肉","type":"当季菜(冬季)","prepTime":"腌制10分钟","steps":"1.肉切片加料酒半勺、生抽半勺、淀粉1勺、盐少许腌10分钟\n2.胡萝卜去皮切菱形片\n3.中火热油下肉片滑炒至变色盛出（火候：中火）\n4.留底油大火爆香蒜末（火候：大火）\n5.下胡萝卜片大火翻炒2分钟至变软\n6.倒回肉片，加生抽半勺、料酒半勺、盐半小勺大火翻炒30秒\n7.撒葱花出锅","ingredients":"胡萝卜2根\n猪里脊肉150g\n蒜2瓣\n葱1根\n生抽1勺\n料酒1勺\n盐1小勺\n淀粉1勺\n食用油2勺\n炒锅"},{"category":"seasonal","month":"3月","stepTime":"焯笋3分钟\n腌肉10分钟\n滑肉2分钟\n炒笋2分钟\n汇合1分钟","name":"春笋炒肉","type":"当季菜(春季)","prepTime":"腌制10分钟","steps":"1.春笋剥壳切片，沸水大火焯3分钟去涩味，捞出沥干（火候：大火）\n2.猪肉切片加料酒半勺、生抽半勺、淀粉1勺、盐少许搅匀腌制10分钟\n3.中火热油下肉片滑炒至变色盛出（火候：中火）\n4.留底油大火爆香姜蒜（火候：大火）\n5.下笋片大火翻炒2分钟\n6.将肉片倒回，加生抽半勺、料酒半勺、白糖半小勺、盐半小勺大火翻炒1分钟\n7.撒葱花出锅","ingredients":"春笋300g\n猪里脊肉150g\n蒜2瓣\n姜3片\n葱1根\n料酒1勺\n生抽1勺\n盐1小勺\n白糖半小勺\n淀粉1勺\n食用油2勺\n炒锅"},{"category":"seasonal","month":"3月","stepTime":"备菜3分钟\n炒蛋1分钟\n炒韭菜1分钟","name":"韭菜炒鸡蛋","type":"当季菜(春季)","prepTime":"无","steps":"1.韭菜洗净切3cm段，沥干水分\n2.鸡蛋打散加盐半小勺搅匀\n3.大火热油至冒烟，倒入蛋液大火快速滑炒至凝固盛出（火候：大火）\n4.锅中补半勺油，大火下韭菜快速翻炒30秒（火候：大火）\n5.倒回鸡蛋，加盐半小勺大火翻炒30秒出锅（韭菜不能久炒否则出水）","ingredients":"韭菜200g\n鸡蛋4个\n盐1小勺\n食用油2勺\n ,"prepTime":"泡米30分钟","steps":"1.大米淘洗后泡30分钟\n2.南瓜去皮去瓤切小块\n3.砂锅大火烧开水（火候：大火）\n4.下大米大火煮沸转小火熬20分钟（火候：小火）\n5.下南瓜块继续小火熬15分钟至南瓜软烂\n6.用勺子将南瓜压碎搅匀\n7.加冰糖搅匀再熬5分钟\n8.熬至粘稠出锅","ingredients":"南瓜300g\n大米100g\n冰糖30g\n水1000ml\n砂锅"},{"category":"seasonal","month":"8月","stepTime":"煎冬瓜3分钟\n焖煮5分钟\n收汁1分钟","name":"红烧冬瓜","type":"当季菜(夏季)","prepTime":"无","steps":"1.冬瓜去皮去瓤切厚块，表面划十字花刀方便入味\n2.蒜切末，葱切葱花\n3.中火热油下冬瓜块中火煎至两面微黄（火候：中火），约3分钟\n4.下蒜末爆香\n5.加生抽1.5勺、老抽半勺、白糖1小勺、盐半小勺翻炒上色\n6.加半碗水大火煮沸（火候：大火）\n7.转小火焖5分钟至冬瓜透明入味（火候：小火）\n8.大火收汁撒葱花出锅（火候：大火）","ingredients":"冬瓜500g\n蒜3瓣\n葱1根\n生抽1.5勺\n老抽半勺\n白糖1小勺\n盐半小勺\n食用油2勺\n炒锅"},{"category":"seasonal","month":"8月","stepTime":"焯秋葵2分钟\n调汁拌制2分钟","name":"凉拌秋葵","type":"当季菜(夏季)","prepTime":"无","steps":"1.秋葵洗净不要去蒂，沸水大火加盐几滴焯2分钟捞出过冰水（火候：大火）\n2.切去蒂部，斜切成段\n3.蒜切末，小米辣切圈\n4.调酱汁：生抽1.5勺、醋1勺、香油1勺、盐半小勺、白糖半小勺、蒜末小米辣搅匀\n5.秋葵摆盘淋上酱汁即可","ingredients":"秋葵250g\n蒜3瓣\n小米辣2个\n生抽1.5勺\n醋1勺\n香油1勺\n盐半小勺\n白糖半小勺\n炒锅"},{"category":"seasonal","month":"8月","stepTime":"备菜5分钟\n炒制1分钟","name":"清炒南瓜藤","type":"当季菜(夏季)","prepTime":"无","steps":"1.南瓜藤撕去外皮，摘成段\n2.洗净沥干水分\n3.蒜切末\n4.大火热油至冒烟（火候：大火）\n5.下蒜末大火爆香10秒\n6.立即下南瓜藤大火快速翻炒（火候：大火）\n7.炒至变软后加盐1小勺翻炒均匀\n8.全程大火约1分钟出锅","ingredients":"南瓜藤300g\n大蒜3瓣\n盐1小勺\n食用油2勺\n炒锅"},{"category":"seasonal","month":"9月","stepTime":"剥板栗15分钟\n浸泡15分钟\n焯水5分钟\n炒糖色3分钟\n炖煮35分钟\n收汁3分钟","name":"板栗烧鸡","type":"当季菜(秋季)","prepTime":"剥板栗15分钟","steps":"1.板栗去壳去皮（可沸水煮3分钟更好剥）\n2.鸡切块冷水浸泡15分钟去血水\n3.冷水下锅大火焯水，加姜2片料酒半勺，撇浮沫捞出（火候：大火）\n4.中火热油下冰糖小火炒糖色至棕红色冒泡（火候：小火）\n5.下鸡块大火翻炒上色（火候：大火）\n6.加姜片料酒半勺、生抽2勺、老抽1勺炒匀\n7.加开水没过鸡块，大火煮沸转小火炖20分钟（火候：小火）\n8.下板栗继续小火炖15分钟\n9.加盐1小勺调味，大火收汁3分钟撒葱花出锅","ingredients":"鸡半只\n板栗200g\n姜4片\n葱1根\n料酒1勺\n生抽2勺\n老抽1勺\n冰糖15g\n盐1小勺\n食用油2勺\n炒锅"},{"category":"seasonal","month":"9月","stepTime":"浸泡20分钟\n焯水5分钟\n炖煮60分钟","name":"莲藕排骨汤","type":"当季菜(秋季)","prepTime":"浸泡20分钟","steps":"1.排骨冷水浸泡20分钟去血水\n2.冷水下锅加姜2片料酒半勺大火焯水捞出（火候：大火）\n3.莲藕去皮切滚刀块\n4.砂锅大火烧开水（火候：大火）\n5.下排骨莲藕姜片大火煮沸\n6.转小火炖1小时（火候：小火）\n7.加盐1.5小勺调味，撒葱花出锅","ingredients":"排骨300g\n莲藕1节\n姜4片\n葱1根\n料酒1勺\n盐1.5小勺\n砂锅"},{"category":"seasonal","month":"9月","stepTime":"浸 ","month":"10月","stepTime":"洗蟹5分钟\n蒸制15分钟","name":"大闸蟹清蒸","type":"当季菜(秋季)","prepTime":"无","steps":"1.大闸蟹用刷子刷洗干净，不要解开绳子\n2.蒸锅大火烧开水（火候：大火）\n3.蒸屉铺姜片葱段和紫苏叶\n4.蟹肚朝上放蒸屉大火蒸15分钟（火候：大火）\n5.调蘸料：姜切末加醋2勺、生抽1勺、白糖半小勺搅匀\n6.时间到关火，取出蘸食","ingredients":"大闸蟹4只\n姜1块\n葱2根\n紫苏叶几片\n醋2勺\n生抽1勺\n白糖半小勺\n蒸锅"},{"category":"seasonal","month":"10月","stepTime":"泡米2小时\n灌米15分钟\n炖煮90分钟","name":"桂花糯米藕","type":"当季菜(秋季)","prepTime":"泡米2小时","steps":"1.糯米提前泡2小时\n2.莲藕去皮，一端切开做盖子\n3.将糯米塞入藕孔用筷子压实\n4.用牙签固定盖子\n5.砂锅加水大火烧开（火候：大火）\n6.放入藕、红糖、冰糖、红枣\n7.大火煮沸转小火炖1.5小时（火候：小火）\n8.取出切片淋汤汁撒桂花即可","ingredients":"莲藕1节\n糯米100g\n红糖50g\n冰糖30g\n桂花少许\n红枣5颗\n砂锅"},{"category":"seasonal","month":"10月","stepTime":"浸泡20分钟\n焯水5分钟\n煸炒5分钟\n炖煮50分钟\n收汁3分钟","name":"芋头焖鸭","type":"当季菜(秋季)","prepTime":"浸泡20分钟","steps":"1.鸭切块冷水浸泡20分钟去血水\n2.冷水下锅大火焯水加姜3片料酒1勺，撇浮沫捞出（火候：大火）\n3.芋头去皮切块（戴手套）\n4.中火热油下鸭块大火煸炒至表面微焦（火候：中火→大火）\n5.下姜蒜爆香，加料酒1勺、生抽2勺、老抽1勺、冰糖翻炒\n6.加开水没过鸭肉大火煮沸\n7.转小火炖30分钟（火候：小火）\n8.下芋头块继续小火炖20分钟至芋头软糯\n9.加盐1小勺，大火收汁3分钟撒葱花","ingredients":"鸭半只\n芋头300g\n姜5片\n蒜3瓣\n葱1根\n生抽2勺\n老抽1勺\n料酒2勺\n冰糖15g\n盐1小勺\n食用油2勺\n炒锅/砂锅"},{"category":"seasonal","month":"10月","stepTime":"浸泡15分钟\n焯水5分钟\n炖煮60分钟","name":"白果炖鸡","type":"当季菜(秋季)","prepTime":"浸泡15分钟","steps":"1.白果去壳去衣，焯水2分钟去苦味\n2.鸡切块冷水浸泡15分钟\n3.冷水下锅大火焯水加姜2片料酒半勺捞出（火候：大火）\n4.砂锅大火烧开水（火候：大火）\n5.下鸡块白果姜片大火煮沸\n6.转小火炖1小时（火候：小火）\n7.加盐1.5小勺调味撒葱花出锅","ingredients":"老母鸡半只\n白果（银杏）100g\n姜4片\n葱1根\n料酒1勺\n盐1.5小勺\n砂锅"},{"category":"seasonal","month":"10月","stepTime":"泡米30分钟\n熬煮40分钟","name":"红薯粥","type":"当季菜(秋季)","prepTime":"泡米30分钟","steps":"1.大米淘洗后泡30分钟\n2.红薯去皮切小丁\n3.砂锅大火烧开水（火候：大火）\n4.下大米大火煮沸转小火熬20分钟（火候：小火）\n5.下红薯丁继续小火熬15分钟至红薯软烂\n6.加冰糖搅匀再熬5分钟\n7.熬至粘稠出锅","ingredients":"红薯1个\n大米100g\n冰糖20g\n水1000ml\n砂锅"},{"category":"seasonal","month":"10月","stepTime":"浸泡20分钟\n焯水5分钟\n炖煮55分钟","name":"山药排骨汤","type":"当季菜(秋季)","prepTime":"浸泡20分钟","steps":"1.排骨冷水浸泡20分钟去血水\n2.冷水下锅大火焯水加姜2片料酒半勺捞出（火候：大火）\n3.山药去皮切滚刀块（戴手套）\n4.砂锅大火烧开水（火候：大火）\n5.下排骨姜片红枣大火煮沸\n6.转小火炖40分钟（火候：小火）\n7.下山药继续小火炖15分钟\n8.加盐1.5小勺调味出锅","ingredients":"排骨300g\n山药200g\n红枣8颗\n姜4片\n盐1.5小勺\n料酒1勺\n砂锅"},{"c // ===== Category Management =====
function getCategories() {
  var saved = lsGet('categories_v1');
  var cats = saved ? JSON.parse(saved) : ['seasonal', 'home'];
  if (cats.indexOf('seasonal') < 0) cats.unshift('seasonal');
  if (cats.indexOf('home') < 0) cats.splice(1, 0, 'home');
  // Sync with RECIPES.categories
  for (var i = 0; i < cats.length; i++) {
    if (!RECIPES.categories[cats[i]]) RECIPES.categories[cats[i]] = [];
  }
  return cats;
}
function saveCategories(cats) {
  lsSet('categories_v1', JSON.stringify(cats));
  pushToCloud();
}
function getRecipesByCategory(cat) {
  return RECIPES.categories[cat] || [];
}
function addCategory(name) {
  name = name.trim();
  if (!name) { showToast('⚠️ 请输入分类名称', true); return false; }
  var cats = getCategories();
  if (cats.indexOf(name) >= 0) { showToast('⚠️ 分类已存在', true); return false; }
  cats.push(name);
  RECIPES.categories[name] = [];
  saveCategories(cats);
  saveRecipesToStorage();
  showToast('✅ 已创建分类：' + name);
  return true;
}
function deleteCategory(name) {
  if (name === 'seasonal' || name === 'home') { showToast('⚠️ 不能删除默认分类', true); return; }
  var recipes = getRecipesByCategory(name);
  if (recipes.length > 0) {
    if (!confirm('分类「' + name + '」中有 ' + recipes.length + ' 道菜品，删除后这些菜品将无法在分类中查看。\n\n确定删除吗？')) return;
  }
  var cats = getCategories();
  var idx = cats.indexOf(name);
  if (idx >= 0) { cats.splice(idx, 1); saveCategories(cats); }
  delete RECIPES.categories[name];
  saveRecipesToStorage();
  renderCategoryCards();
  showToast('🗑 已删除分类：' + name);
}
function renameCategory(oldName, newName) {
  newName = newName.trim();
  if (!newName) { showToast('⚠️ 请输入新名称', true); return false; }
  if (oldName === 'seasonal' || oldName === 'home') { showToast('⚠️ 不能重命名默认分类', true); return false; }
  var cats = getCategories();
  if (cats.indexOf(newName) >= 0 && newName !== oldName) { showToast('⚠️ 分类名已存在', true); return false; }
  var idx = cats.indexOf(oldName);
  if (idx >= 0) { cats[idx] = newName; saveCategories(cats); }
  RECIPES.categories[newName] = RECIPES.categories[oldName] || [];
  // Update recipes in this category
  for (var i = 0; i < RECIPES.categories[newName].length; i++) {
    RECIPES.categories[newName][i].category = newName;
  }
  delete RECIPES.categories[oldName];
  saveRecipesToStorage();
  renderCategoryCards();
  showToast('✅ 已重命名为：' + newName);
  return true;
}

function openCategoryManagement() {
  var cats = getCategories();
  var html = '<h2>📂 管理分类</h2>';
  html += '<ul class="cat-mgmt-list">';
  for (var i = 0; i < cats.length; i++) {
    var cat = cats[i];
    var isFixed = cat === 'seasonal' || cat === 'home';
    var count = (RECIPES.categories[cat] || []).length;
    var icon = cat === 'seasonal' ? '🌿' : (cat === 'home' ? '🍖' : '📁');
    html += '<li class="cat-mgmt-item' + (isFixed ? ' fixed-cat' : '') + '">';
    html += '<span class="cat-mgmt-name">' + icon + ' ' + escapeHTML(cat) + '</span>';
    html += '<span class="cat-mgmt-count">' + count + '道</span>';
    if (!isFixed) {
      html += '<div class="cat-mgmt-actions">';
      html += '<button class="btn-rename" onclick="promptRenameCategory(\'' + escapeQuote(cat) + '\')">✏️ 重命名</button>';
      html += '<button class="btn-delete-cat" onclick="deleteCategory(\'' + escapeQuote(cat) + '\');openCategoryManagement();">🗑 删除</button>';
      html += '</div>';
    }
    html += '</li>';
  }
  html += '</ul>';
  html += '<div class="cat-mgmt-add">';
  html += '<input type="text" id="newCatName" placeholder="输入新分类名称...">';
  html += '<button onclick="addCategoryFromInput()">➕ 新增</button>';
  html += '</div>';
  html += '<div class="form-actions" style="margin-top:12px;"><button class="btn-cancel" onclick="closeCatMgmt()">关闭</button></div>';
  document.getElementById('catMgmtContent').innerHTML = html;
  document.getElementById('catMgmtOverlay').classList.add('active');
}
function addCategoryFromInput() {
  var input = document.getElementById('newCatName');
  if (input && addCategory(input.value)) {
    input.value = '';
    openCategoryManagement();
  }
}
function promptRenameCategory(oldName) {
  var newName = prompt('将「' + oldName + '」重命名为：', oldName);
  if (newName && newName !== oldName) {
    renameCategory(oldName, newName);
    openCategoryManagement();
  }
}
function closeCatMgmt() {
  document.getElementById('catMgmtOverlay').classList.remove('active');
}

}

function syncCategoryDisplay() {

function renderCategoryCards() {
  var cats = getCategories();
  var grid = document.getElementById('categoryGrid');
  if (!grid) return;
  var html = '';
  var icons = {seasonal: '🌿', home: '🍖'};

var currentWeekOffset = 0;

// ===== Star/Favorite Management =====
function getStarredRecipeIds() {
  var saved = lsGet('starred_recipes_v1');
  return saved ? JSON.parse(saved) : [];
}
function saveStarredRecipeIds(ids) {
  lsSet('starred_recipes_v1', JSON.stringify(ids));
  pushToCloud();
}
function isRecipeStarred(id) {
  return getStarredRecipeIds().indexOf(id) >= 0;
}
function toggleStarRecipe(id) {
  var ids = getStarredRecipeIds();
  var idx = ids.indexOf(id);
  var recipe = RECIPES.getById(id);
  var recipeName = recipe ? recipe.name : '菜品';
  if (idx >= 0) {

  if (currentCategory) {
    currentRecipes = getRecipesByCategory(currentCategory);

}
var starFilterActive = false;
function toggleStarFilter() {
  starFilterActive = !starFilterActive;
  var btn = document.getElementById('starFilterBtn');
  if (btn) {
    btn.textContent = starFilterActive ? '⭐ 全部' : '⭐ 星标';
    if (starFilterActive) btn.classList.add('active'); else btn.classList.remove('active');
  }

}

// ===== Date Helpers =====
function dateKey(d) { return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n) { return n<10?'0'+n:''+n; }
function formatDate(d) { return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
function getToday() { var d = new Date(); return dateKey(d); }
function getMonday(d) {
  d = new Date(d);
  var day = d.getDay();
  var diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function getWeekDates() {
  var now = new Date();
  var monday = getMonday(now);
  monday.setDate(monday.getDate() + currentWeekOffset * 7);
  var dates = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday);
    d.setDate(d.getDate() + i);
    dates.push(d);
  }
  return dates;
}
function parseKeyToDate(dk) {
  var parts = dk.split('-');
  return new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
}

// ===== Menu Persistence =====
function getMenu() { var saved = lsGet('menu_v2'); return saved ? JSON.parse(saved) : {}; }
function saveMenu(menu) { lsSet('menu_v2', JSON.stringify(menu)); }
function getDayRecipes(dk) { var menu = getMenu(); return menu[dk] || []; }

function addRecipeToDay(dk, recipe) {
  var menu = getMenu();
  if (!menu[dk]) menu[dk] = [];
  var exists = menu[dk].some(function(r) { return r.name === recipe.name; });
  if (!exists) {
    menu[dk].push({id:recipe.id||'', name:recipe.name, stepTime:recipe.stepTime, prepTime:recipe.prepTime, type:recipe.type, month:recipe.month, ingredients:recipe.ingredients, steps:recipe.steps, image:recipe.image||''});
    saveMenu(menu);
    renderWeek();
    showToast('✅ 已添加「' + recipe.name + '」到 ' + formatDate(parseKeyToDate(dk)));
    return true;
  }
  return false;
}

function removeRecipeFromDay(dk, recipeName) {
  var menu = getMenu();
  if (menu[dk]) {
    menu[dk] = menu[dk].filter(function(r) { return r.name !== recipeName; });
    saveMenu(menu);
    renderWeek();
  }
}

function clearAll() {
  if (confirm('确定要清空本周所有食谱吗？此操作不可恢复。')) {
    lsRemove('menu_v2');
    renderWeek();
    showToast('🗑 已清空本周食谱');
  }
}

// ===== Render Week =====
function renderWeek() {
  if (!activeDay) activeDay = getToday();
  var dates = getWeekDates();
  var weekLabel = document.getElementById('weekLabel');
  if (weekLabel) {
    var monday = dates[0], sunday = dates[6];
    weekLabel.textContent = formatDate(monday) + ' - ' + formatDate(sunday);
  }
  var weekStarBtn = document.getElementById('weekStarBtn');
  if (weekStarBtn) weekStarBtn.style.display = 'none';
  var dayNames = ['周一','周二','周三','周四','周五','周六','周日'];
  var todayKey = getToday();
  var grid = document.getElementById('weekGrid');
  var html = '';
  for (var i = 0; i < 7; i++) {
    var d = dates[i], dk = dateKey(d);
    var isToday = dk === todayKey;
    var isActive = dk === activeDay;
    var recipes = getDayRecipes(dk);
    html += '<div class="day-card' + (isToday ? ' today' : '') + (isActive ? ' active' : '') + '" onclick="setActiveDay(\'' + dk + '\')">';
    if (isToday && isActive) {
      html += '<div class="day-badge today-badge">今天·选中</div>';
    } else if (isToday) {
      html += '<div class="day-badge today-badge">今天</div>';
    } else if (isActive) {
      html += '<div class="day-badge active-badge">已选中</div>';
    }
    html += '<div class="day-name">' + dayNames[i] + '</div>';
    html += '<div class="day-date">' + formatDate(d) + '</div>';
    if (recipes.length === 0) {
      html += '<div class="day-empty"><span class="empty-icon">🍽️</span>暂无菜品</div>';
    } else {
      for (var j = 0; j < recipes.length; j++) {
        var r = recipes[j];
        html += '<div class="day-recipe" onclick="event.stopPropagation();showDayRecipeDetail(\'' + dk + '\',' + j + ')">';
        html += '<span class="recipe-name">' + escapeHTML(r.name) + '</span><br>';
        html += '<span class="recipe-time">⏱ ' + escapeHTML(r.stepTime || '') + '</span>';
        html += '<button class="remove-btn" onclick="event.stopPropagation();removeRecipeFromDay(\'' + dk + '\',\'' + escapeQuote(r.name) + '\')">×</button>';
        html += '</div>';
      }
    }
    html += '</div>';
  }
  grid.innerHTML = html;
  updateActiveDayInfo();
}

function escapeHTML(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeQuote(str) {
  return str.replace(/'/g,"\\'").replace(/"/g,'\\"');
}

// ===== Active Day Management =====
function setActiveDay(dk) { activeDay = dk; renderWeek(); showToast('📌 已选中 ' + formatDate(parseKeyToDate(dk)) + '，去挑选菜品将添加到这一天'); }
function updateActiveDayInfo() {
  var dk = activeDay || getToday();
  var d = parseKeyToDate(dk);
  var text = formatDate(d) + '（' + ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()] + '）';
  var el = document.getElementById('activeDayText'); if (el) el.textContent = text;
  var el2 = document.getElementById('activeDayInfo2'); if (el2) el2.innerHTML = '📌 将为 <strong>' + text + '</strong> 挑选菜品';
  var el3 = document.getElementById('activeDayInfo3'); if (el3) el3.innerHTML = '📌 将为 <strong>' + text + '</strong> 挑选菜品';
}

// ===== Tab Navigation =====
function switchTab(screenId, tabEl) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(screenId).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
  if (tabEl) tabEl.classList.add('active');
  var titles = {screen1:'今日食谱', screen2:'菜品库', screen3: getCategoryDisplayName(currentCategory), screen4:'历史查询'};
  document.getElementById('headerTitle').textContent = titles[screenId] || '今日食谱';
  if (screenId === 'screen1') { renderWeek(); }
  if (screenId === 'screen2') { updateActiveDayInfo(); renderCategoryCards(); }
  if (screenId === 'screen3') { updateActiveDayInfo(); }
  if (screenId === 'screen4') { if (!historyDate) historyDate = new Date(); renderHistory(); }
}

// ===== Screen Navigation (legacy, for internal use) =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');

// ===== Recipe List =====
function openRecipeList(category) {
  currentCategory = category;
  currentRecipes = getRecipesByCategory(category);
  document.getElementById('searchBox').value = '';
  renderRecipeList(currentRecipes);
  switchTab('screen3', null);
}

function syncRecipeCounts() {
  renderCategoryCards();
}

function renderRecipeList(list) {
  var fc = document.getElementById('filterCount'); if (fc) fc.textContent = '共 ' + list.length + ' 道';
  // Sort: starred first, then by category-specific rules
  var monthOrder = { '全年':0, '1月':1, '2月':2, '3月':3, '4月':4, '5月':5, '6月':6, '7月':7, '8月':8, '9月':9, '10月':10, '11月':11, '12月':12 };
  var sorted = list.slice().sort(function(a, b) {
    var aStar = isRecipeStarred(a.id) ? 1 : 0;
    var bStar = isRecipeStarred(b.id) ? 1 : 0;
    if (aStar !== bStar) return bStar - aStar;
    // Seasonal: sort by month order
    if (currentCategory === 'seasonal') {
      var aMonth = monthOrder[a.month] !== undefined ? monthOrder[a.month] : 99;
      var bMonth = monthOrder[b.month] !== undefined ? monthOrder[b.month] : 99;
      return aMonth - bMonth;
    }
    // Home-cooked: newest first (reverse chronological)
    if (currentCategory === 'home') {
      return (parseInt(b.createdAt) || 0) - (parseInt(a.createdAt) || 0);
    }
    return 0;
  });
  var html = '';
  for (var i = 0; i < sorted.length; i++) {
    var r = sorted[i];
    var starred = isRecipeStarred(r.id);
    var ingLines = (r.ingredients || '').split('\n');
    var ingPreview = ingLines.slice(0, 3).join('\n');
    if (ingLines.length > 3) ingPreview += '\n...（共' + ingLines.length + '项）';
    html += '<div class="recipe-card' + (currentCategory === 'home' ? ' home-card' : '') + (starred ? ' starred' : '') + '" style="position:relative;">';
    html += '<button class="r-star-btn" onclick="event.stopPropagation();toggleStarRecipe(\'' + r.id + '\')" title="' + (starred ? '取消星标' : '添加星标') + '">' + (starred ? '⭐' : '☆') + '</button>';
    html += '<div class="r-name">' + escapeHTML(r.name) + '</div>';
    html += '<div class="r-meta">';
    if (r.month) html += '<span>📅 ' + escapeHTML(r.month) + '</span>';
    html += '<span>🏷 ' + escapeHTML(r.type || '') + '</span>';
    if (r.isCustom) html += '<span style="background:#e8f5e9;color:#27ae60;">✏️ 自定义</span>';
    html += '</div>';
    html += '<div class="r-prep">⏱ 准备时间：' + escapeHTML(r.stepTime || '暂无') + '</div>';
    html += '<div class="r-ingredients">📋 ' + ingPreview.replace(/\n/g, '<br>') + '</div>';
    html += '<div class="r-actions">';
    html += '<button class="btn-select" onclick="pickRecipeById(\'' + r.id + '\')">✅ 挑选</button>';
    html += '<button class="btn-detail" onclick="showDetailById(\'' + r.id + '\')">📄 详情</button>';
    html += '<button class="btn-edit-card" onclick="openRecipeFormById(\'' + r.id + '\')">✏️ 编辑</button>';
    html += '</div></div>';
  }
  var rl = document.getElementById('recipeList'); if (rl) rl.innerHTML = html;
}

function filterRecipes() {
  var q = document.getElementById('searchBox').value.toLowerCase();
  var filtered = currentRecipes.filter(function(r) { return r.name.toLowerCase().indexOf(q) >= 0; });
  if (starFilterActive) {
    filtered = filtered.filter(function(r) { return isRecipeStarred(r.id); });
  }
  renderRecipeList(filtered);
}

function getCurrentFilteredRecipes() {
  var q = document.getElementById('searchBox').value.toLowerCase();
  return currentRecipes.filter(function(r) { return r.name.toLowerCase().indexOf(q) >= 0; });
}

// ===== Pick Recipe =====
function pickRecipeById(id) {
  var recipe = RECIPES.getById(id);
  if (!recipe) return;
  var dk = activeDay || getToday();
  var added = addRecipeToDay(dk, recipe);
  if (added) { switchTab('screen1', document.querySelector('.tab-item[data-tab=screen1]')); }
  else { showToast('⚠️ 该菜品已在 ' + formatDate(parseKeyToDate(dk)) + ' 中', true); }
}

function showDetailById(id) {

  if (!recipe) return;
  showDetailForRecipe(recipe);
}

function showDayRecipeDetail(dk, index) {
  var recipes = getDayRecipes(dk);

// ===== Form Modal (Add/Edit) =====
function openRecipeFormById(id) {
  var recipe = RECIPES.getById(id);
  if (recipe) openRecipeForm(recipe, null);
}

function openRecipeForm(recipeData, presetCategory) {
  editingRecipeId = recipeData ? recipeData.id : null;
  currentImageData = recipeData ? (recipeData.image || '') : '';
  var isEdit = !!recipeData;
  var cat = recipeData ? recipeData.category : (presetCategory || 'seasonal');
  var title = isEdit ? '✏️ 编辑菜品' : '➕ 新增菜品';

  var html = '<h2>' + title + '</h2>';
  html += '<div class="form-group"><label>菜品名称 *</label><input type="text" id="formName" value="' + escapeHTML(recipeData ? recipeData.name : '') + '" placeholder="请输入菜品名称"></div>';
  html += '<div class="form-group"><label>类别 *</label><select id="formCategory" onchange="onFormCategoryChange()">';
  var cats = getCategories();
  for (var ci = 0; ci < cats.length; ci++) {
    var c = cats[ci];
    html += '<option value="' + c + '"' + (cat === c ? ' selected' : '') + '>' + escapeHTML(c) + '</option>';
  }
  html += '</select></div>';
  html += '<div class="form-group" id="formMonthGroup" style="' + (cat!=='seasonal'?'display:none':'') + '"><label>适合月份</label><select id="formMonth">';
  var months = ['全年','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var curMonth = recipeData ? (recipeData.month || '1月') : '1月';
  for (var m = 0; m < months.length; m++) {
    html += '<option value="' + months[m] + '"' + (curMonth === months[m] ? ' selected' : '') + '>' + months[m] + '</option>';
  }
  html += '</select></div>';
  html += '<div class="form-group"><label>菜品类型</label><input type="text" id="formType" value="' + escapeHTML(recipeData ? recipeData.type : (cat==='seasonal'?'当季菜':'家常菜')) + '" placeholder="如：家常菜、汤品、凉菜"></div>';
  html += '<div class="form-group"><label>准备时间（每步时间）</label><input type="text" id="formStepTime" value="' + escapeHTML(recipeData ? recipeData.stepTime : '') + '" placeholder="如：腌肉15分钟、炒制5分钟"></div>';
  html += '<div class="form-group"><label>提前预留时间</label><input type="text" id="formPrepTime" value="' + escapeHTML(recipeData ? recipeData.prepTime : '') + '" placeholder="如：腌制30分钟"></div>';
  html += '<div class="form-group"><label>需要购买的材料（含锅具）</label><textarea id="formIngredients" rows="4" placeholder="每行一项材料">' + escapeHTML(recipeData ? recipeData.ingredients : '') + '</textarea></div>';
  html += '<div class="form-group"><label>制作流程</label><textarea id="formSteps" rows="6" placeholder="每行一个步骤">' + escapeHTML(recipeData ? recipeData.steps : '') + '</textarea></div>';
  html += '<div class="form-group"><label>菜品图片</label><div class="image-upload-area"><input type="file" id="imageFileInput" accept="image/*" onchange="handleImageUpload(this)"><div class="image-preview" id="imagePreview">';
  if (currentImageData) {
    html += '<img src="' + currentImageData + '" alt="预览">';
  } else {
    html += '<span class="upload-placeholder">📷 点击上传图片（可选）</span>';
  }
  html += '</div></div><button class="btn-remove-image" id="btnRemoveImage" style="' + (currentImageData ? '' : 'display:none') + ';" onclick="removeImage()">移除图片</button></div>';
  html += '<div class="form-actions">';
  if (isEdit) html += '<button class="btn-delete" onclick="deleteRecipe()">🗑 删除菜品</button>';
  html += '<button class="btn-cancel" onclick="closeFormModal()">取消</button>';
  html += '<button class="btn-save" onclick="saveRecipeForm()">💾 保存</button>';
  html += '</div>';

  document.getElementById('formModalContent').innerHTML = html;
  document.getElementById('formModalOverlay').classList.add('active');
}

function onFormCategoryChange() {
  var cat = document.getElementById('formCategory').value;
  var mg = document.getElementById('formMonthGroup');
  if (mg) mg.style.display = cat === 'seasonal' ? '' : 'none';
  var ft = document.getElementById('formType');
  if (ft && !ft.value) ft.value = cat === 'seasonal' ? '当季菜' : '家常菜';
}

function closeFormModal() {
  document.getElementById('formModalOverlay').classList.remove('active');
  editingRecipeId = null;
  currentImageData = '';
}

function saveRecipeForm() {
  var name = document.getElementById('formName').value.trim();
  if (!name) { showToast('⚠️ 请输入菜品名称', true); return; }
  var category = document.getElementById('formCategory').value;
  var month = document.getElementById('formMonth').value;
  var type = document.getElementById('formType').value.trim();
  var stepTime = document.getElementById('formStepTime').value.trim();
  var prepTime = document.getElementById('formPrepTime').value.trim();
  var ingredients = document.getElementById('formIngredients').value.trim();
  var steps = document.getElementById('formSteps').value.trim();

  var recipe = {
    name: name, category: category, month: month, type: type,
    stepTime: stepTime, prepTime: prepTime, ingredients: ingredients, steps: steps,
    image: currentImageData
  };

  if (editingRecipeId) {
    updateExistingRecipe(editingRecipeId, recipe);
    showToast('✅ 菜品已更新');
  } else {
    addNewRecipe(recipe);
    showToast('✅ 新菜品已添加');
  }
  closeFormModal();
}

function addNewRecipe(recipe) {
  recipe.id = generateRecipeId();
  recipe.isCustom = true;
  recipe.createdAt = Date.now().toString();
  recipe.image = recipe.image || '';
  if (!RECIPES.categories[recipe.category]) RECIPES.categories[recipe.category] = [];
  RECIPES.categories[recipe.category].push(recipe);
  saveRecipesToStorage();
  syncRecipeCounts();
  if (currentCategory === recipe.category) {
    currentRecipes = getRecipesByCategory(currentCategory);
    renderRecipeList(currentRecipes);
  }
}

function updateExistingRecipe(id, data) {
  var recipe = RECIPES.getById(id);
  if (!recipe) return;
  var oldCategory = recipe.category;
  for (var key in data) { if (data.hasOwnProperty(key)) recipe[key] = data[key]; }
  if (oldCategory !== recipe.category) {
    RECIPES.removeById(id);
    if (!RECIPES.categories[recipe.category]) RECIPES.categories[recipe.category] = [];
    RECIPES.categories[recipe.category].push(recipe);
  }
  saveRecipesToStorage();
  syncRecipeCounts();
  if (currentCategory) {
    currentRecipes = getRecipesByCategory(currentCategory);
    renderRecipeList(currentRecipes);
  }
}

function deleteRecipe() {
  if (!editingRecipeId) return;
  if (!confirm('确定要删除这道菜品吗？\n\n删除后不可恢复。如果该菜品已添加到某日食谱中，仍会保留在当日菜单中。')) return;
  var recipe = RECIPES.getById(editingRecipeId);
  if (!recipe) return;
  RECIPES.removeById(editingRecipeId);
  saveRecipesToStorage();
  syncRecipeCounts();
  closeFormModal();
  if (currentCategory === recipe.category) {
    currentRecipes = getRecipesByCategory(currentCategory);
    renderRecipeList(currentRecipes);
  }
  showToast('🗑 菜品已删除');
}

// ===== Image Upload =====
function handleImageUpload(fileInput) {
  var file = fileInput.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) { showToast('⚠️ 图片不能超过3MB，请压缩后重试', true); fileInput.value = ''; return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    currentImageData = e.target.result;
    var preview = document.getElementById('imagePreview');
    if (preview) preview.innerHTML = '<img src="' + currentImageData + '" alt="预览">';
    var btn = document.getElementById('btnRemoveImage');
    if (btn) btn.style.display = '';
  };
  reader.readAsDataURL(file);
}

function removeImage() {
  currentImageData = '';
  var preview = document.getElementById('imagePreview');
  if (preview) preview.innerHTML = '<span class="upload-placeholder">📷 点击上传图片（可选）</span>';
  var btn = document.getElementById('btnRemoveImage');
  if (btn) btn.style.display = 'none';
  var fileInput = document.getElementById('imageFileInput');
  if (fileInput) fileInput.value = '';
}

// ===== History =====
function renderHistory() {
  var d = historyDate || new Date();
  var dk = dateKey(d);
  var datePicker = document.getElementById('historyDatePicker');
  if (datePicker) datePicker.value = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  var dayNames = ['周日','周一','周二','周三','周四','周五','周六'];
  var info = document.getElementById('historyDateInfo');
  if (info) info.innerHTML = formatDate(d) + ' <strong>' + dayNames[d.getDay()] + '</strong>';
  var recipes = getDayRecipes(dk);
  var list = document.getElementById('historyRecipeList');
  if (!list) return;
  if (recipes.length === 0) {
    list.innerHTML = '<div class="history-empty"><span class="empty-icon">🍽️</span>该日期暂无菜品记录<br><span style="font-size:12px;">去「今日食谱」中添加菜品吧</span></div>';
  } else {
    var html = '';
    for (var i = 0; i < recipes.length; i++) {
      var r = recipes[i];
      html += '<div class="history-recipe-item" onclick="showDetailForRecipe({name:\'' + escapeQuote(r.name) + '\',ingredients:\'' + escapeQuote(r.ingredients||'') + '\',steps:\'' + escapeQuote(r.steps||'') + '\',stepTime:\'' + escapeQuote(r.stepTime||'') + '\',prepTime:\'' + escapeQuote(r.prepTime||'') + '\',type:\'' + escapeQuote(r.type||'') + '\',month:\'' + escapeQuote(r.month||'') + '\',image:\'' + escapeQuote(r.image||'') + '\'})">';
      html += '<span class="h-name">' + escapeHTML(r.name) + '</span>';
      html += '<span class="h-time">⏱ ' + escapeHTML(r.stepTime || '') + '</span>';
      html += '<span class="h-arrow">›</span>';
      html += '</div>';
    }
    list.innerHTML = html;
  }
}

function prevHistoryDay() {
  if (!historyDate) historyDate = new Date();
  historyDate.setDate(historyDate.getDate() - 1);
  renderHistory();
}
function nextHistoryDay() {
  if (!historyDate) historyDate = new Date();
  historyDate.setDate(historyDate.getDate() + 1);
  renderHistory();
}
function goHistoryToday() { historyDate = new Date(); renderHistory(); }
function onHistoryDateChange() {
  var picker = document.getElementById('historyDatePicker');
  if (picker && picker.value) {
    var parts = picker.value.split('-');
    historyDate = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
    renderHistory();
  }
}

// ===== Week Navigation =====
function prevWeek() { currentWeekOffset--; activeDay = null; renderWeek(); }
function nextWeek() { currentWeekOffset++; activeDay = null; renderWeek(); }
function goCurrentWeek() { currentWeekOffset = 0; activeDay = null; renderWeek(); }

// ===== Calendar =====
function openCalendar() {
  var dates = getWeekDates();
  calendarYear = dates[0].getFullYear();
  calendarMonth = dates[0].getMonth();
  renderCalendar();
  document.getElementById('calendarOverlay').classList.add('active');
}
function closeCalendar() {
  document.getElementById('calendarOverlay').classList.remove('active');
}
function renderCalendar() {
  var y = calendarYear, m = calendarMonth;
  var firstDay = new Date(y, m, 1);
  var lastDay = new Date(y, m + 1, 0);
  var startDow = firstDay.getDay();
  var daysInMonth = lastDay.getDate();
  var today = new Date();
  var todayKey = dateKey(today);
  var weekDates = getWeekDates();
  var weekKeys = weekDates.map(function(d) { return dateKey(d); });
  var starredDates = [];

  var html = '<h2>📅 选择日期</h2>';
	html += '<div class="calendar-nav">';
	html += '<button onclick="calendarPrevMonth()">◀</button>';
	html += '<span class="cal-month-label">' + y + '年 ' + (m + 1) + '月</span>';
	html += '<button onclick="calendarNextMonth()">▶</button>';
	html += '</div>';
	html += '<div class="calendar-grid">';
  var headers = ['日','一','二','三','四','五','六'];
  for (var h = 0; h < 7; h++) html += '<div class="cal-day-header">' + headers[h] + '</div>';
  // Previous month fill
  if (startDow > 0) {
    var prevLast = new Date(y, m, 0).getDate();
    for (var p = startDow - 1; p >= 0; p--) {
      html += '<div class="cal-day other-month">' + (prevLast - p) + '</div>';
    }
  }
  // Current month days
  for (var d = 1; d <= daysInMonth; d++) {
    var date = new Date(y, m, d);
    var dk = dateKey(date);
    var isToday = dk === todayKey;
    var inWeek = weekKeys.indexOf(dk) >= 0;
    var cls = 'cal-day';
    if (isToday) cls += ' today';
    if (inWeek) cls += ' in-week';
    html += '<div class="' + cls + '" onclick="selectCalendarDay(' + d + ')">';
    html += d;
    html += '</div>';
  }
  // Next month fill
  var remaining = 7 - ((startDow + daysInMonth) % 7);
  if (remaining < 7) {
    for (var n = 1; n <= remaining; n++) {
      html += '<div class="cal-day other-month">' + n + '</div>';
    }
  }
  html += '</div>';
  html += '<div class="calendar-actions">';
	html += '<button onclick="goCurrentWeek();closeCalendar();">📅 本周</button>';
	html += '<button class="btn-cancel" onclick="closeCalendar()">关闭</button>';
	html += '</div>';
  document.getElementById('calendarPopup').innerHTML = html;
}
function calendarPrevMonth() {
  calendarMonth--;
  if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
  renderCalendar();
}
function calendarNextMonth() {
  calendarMonth++;
  if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
  renderCalendar();
}
function selectCalendarDay(day) {
  var targetDate = new Date(calendarYear, calendarMonth, day);
  var targetMonday = getMonday(targetDate);
  var currentMonday = getMonday(new Date());
  currentWeekOffset = Math.round((targetMonday - currentMonday) / (7 * 86400000));
  activeDay = null;
  closeCalendar();
  renderWeek();
  showToast('📅 已跳转到 ' + formatDate(targetDate) + ' 所在周');
}

// ===== Toast =====
function showToast(msg, isWarning) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (isWarning ? ' warning' : '');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(function() { toast.classList.remove('show'); }, 2500);
}

// ===== Modal Close =====
document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.getElementById('formModalOverlay').addEventListener('click', function(e) { if (e.target === this) closeFormModal(); });
document.getElementById('calendarOverlay').addEventListener('click', function(e) { if (e.target === this) closeCalendar(); });
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeModal(); closeFormModal(); closeCalendar(); }
});

// ===== Init =====
activeDay = getToday();
renderWeek();

// ===== App Title Customization =====
function getCurrentAppTitle() {
  var saved = lsGet('app_title');
  if (saved) return saved;
  var h1 = document.querySelector('.header h1');
  if (h1) {
    var text = h1.textContent.replace(/^[🍳🥘🍲🍜🥟🍝🥗🍱🥩🍗🍖🌮🍕🍔🥪🥙🧆🥘]\s*/, '');
    return text.trim() || '喉结儿菜谱';
  }
  return '喉结儿菜谱';
}

function initAppTitle() {
  var savedTitle = lsGet('app_title');
  var h1 = document.querySelector('.header h1');
  if (savedTitle && h1) {
    h1.textContent = '🍳 ' + savedTitle;
    document.title = savedTitle;
  }
  if (h1) {
    h1.title = '点击修改菜谱名称';
    h1.addEventListener('click', function() {
      var currentTitle = getCurrentAppTitle();
      var newTitle = prompt('请输入新的菜谱名称：', currentTitle);
      if (newTitle !== null && newTitle.trim()) {
        newTitle = newTitle.trim();
        lsSet('app_title', newTitle);
        h1.textContent = '🍳 ' + newTitle;
        document.title = newTitle;
        pushToCloud();
        showToast('✅ 菜谱名称已更新为：' + newTitle);
      }
    });
  }
}

initAppTitle();

function autoInitCloudSync() {
  initCloud();
  var savedEnabled = lsGet('cloud_sync_enabled');
  if (GIST_CONFIG.token && savedEnabled === '1') {
    console.log('☁️ 自动初始化：检测到已保存的 Token 和启用状态，自动启用云同步');
    enableCloudSync();
    return;
  }
  console.log('☁️ 自动初始化：等待用户手动启用云同步');
}

autoInitCloudSync();
